<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Seleccionar Perfil</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  background:#141414;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}

.container{
  text-align:center;
  width:100%;
  max-width:1200px;
}

h1{
  font-size:clamp(28px,3vw,48px);
  font-weight:400;
  margin-bottom:40px;
}

.profiles{
  display:flex;
  gap:30px;
  justify-content:center;
  flex-wrap:wrap;
}

.profile{
  cursor:pointer;
  transition:.2s ease;
  position:relative;
  width:160px;
}

.profile:hover{
  transform:scale(1.08);
}

.avatar{
  width:140px;
  height:140px;
  margin:auto;
  border-radius:8px;
  overflow:hidden;
  background:#333;
  display:flex;
  justify-content:center;
  align-items:center;
  border:3px solid transparent;
}

.profile:hover .avatar{
  border-color:white;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.name{
  margin-top:12px;
  font-size:18px;
  color:#999;
}

.profile:hover .name{
  color:white;
}

.add{
  font-size:60px;
  color:#999;
}

.btn{
  margin-top:50px;
  padding:12px 25px;
  border:1px solid #999;
  background:transparent;
  color:#999;
  cursor:pointer;
  font-size:16px;
}

.btn:hover{
  color:white;
  border-color:white;
}

.delete-btn{
  position:absolute;
  top:8px;
  right:8px;
  background:#e50914;
  border:none;
  color:white;
  border-radius:50%;
  width:24px;
  height:24px;
  cursor:pointer;
  display:none;
  z-index:10;
}

.profile.edit-mode .delete-btn{
  display:block;
}

.profile.kids .delete-btn{
  display:none !important;
}

/* MODAL */
.avatar-selector{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.avatar-selector h2{
  margin-bottom:30px;
}

.avatar-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
  gap:20px;
  width:min(90%,600px);
  margin-bottom:30px;
}

.avatar-grid img{
  width:100px;
  height:100px;
  border-radius:10px;
  cursor:pointer;
  object-fit:cover;
  transition:.2s;
}

.avatar-grid img:hover{
  transform:scale(1.08);
}

.modal-btn{
  padding:10px 18px;
  border:none;
  background:#333;
  color:white;
  cursor:pointer;
  border-radius:6px;
}
</style>
</head>

<body>

<div class="container">
  <h1>¿Quién está viendo?</h1>

  <div class="profiles" id="profiles"></div>

  <button class="btn" onclick="toggleEditMode()">
    Administrar perfiles
  </button>
</div>

<!-- MODAL -->
<div id="avatarSelector" class="avatar-selector">
  <h2>Elige un avatar</h2>

  <div class="avatar-grid">
    <img src="imgs/perfiles/profile1.jpg" onclick="createProfile(this.src)">
    <img src="imgs/perfiles/profile2.jpg" onclick="createProfile(this.src)">
    <img src="imgs/perfiles/profile3.jpg" onclick="createProfile(this.src)">
    <img src="imgs/perfiles/profile4.jpg" onclick="createProfile(this.src)">
  </div>

  <button class="modal-btn" onclick="closeSelector()">Cerrar</button>
</div>

<script>
/* =====================================
   VALIDAR SESIÓN
===================================== */
const session = JSON.parse(localStorage.getItem("session"));

if(!session){
  window.location.href = "login.html";
}

let editMode = false;

/* =====================================
   CARGAR PERFILES
===================================== */
async function loadProfiles(){
  try{
    const res = await fetch(`/api/perfiles/${session.id}`);
    const perfiles = await res.json();
    render(perfiles);
  }catch(err){
    console.error("Error cargando perfiles", err);
  }
}

/* =====================================
   RENDER
===================================== */
function render(profiles){
  const container = document.getElementById("profiles");
  container.innerHTML = "";

  profiles.forEach(p => {

    const div = document.createElement("div");

    div.className =
      "profile" +
      (editMode ? " edit-mode" : "") +
      (p.tipo === "kids" ? " kids" : "");

    div.innerHTML = `
      <button class="delete-btn">×</button>

      <div class="avatar">
        <img src="${p.avatar || 'imgs/perfiles/profile1.jpg'}">
      </div>

      <div class="name">${p.nombre}</div>
    `;

    // seleccionar perfil
    div.addEventListener("click", () => {
      if(editMode) return;
      selectProfile(p);
    });

    // botón eliminar
    const btnDelete = div.querySelector(".delete-btn");
    btnDelete.addEventListener("click", (e) => {
      e.stopPropagation();
      deleteProfile(p);
    });

    container.appendChild(div);
  });

  // botón agregar
  const add = document.createElement("div");
  add.className = "profile";

  add.innerHTML = `
    <div class="avatar">
      <div class="add">+</div>
    </div>
    <div class="name">Agregar</div>
  `;

  add.onclick = () => {
    if(editMode) return;
    openSelector();
  };

  container.appendChild(add);
}

/* =====================================
   SELECCIONAR PERFIL
===================================== */
function selectProfile(perfil){
  localStorage.setItem("selectedProfile", JSON.stringify(perfil));

  if(perfil.tipo === "kids"){
    window.location.href = "kids.html";
  }else{
    window.location.href = "index.html";
  }
}

/* =====================================
   MODAL
===================================== */
function openSelector(){
  document.getElementById("avatarSelector").style.display = "flex";
}

function closeSelector(){
  document.getElementById("avatarSelector").style.display = "none";
}

/* =====================================
   CREAR PERFIL
===================================== */
async function createProfile(avatar){
  const nombre = prompt("Nombre del perfil:");

  if(!nombre) return;

  try{
    await fetch("/api/perfiles", {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        usuario_id: session.id,
        nombre,
        tipo:"normal",
        avatar
      })
    });

    closeSelector();
    loadProfiles();

  }catch(err){
    console.error("Error creando perfil", err);
  }
}

/* =====================================
   ELIMINAR PERFIL
===================================== */
async function deleteProfile(perfil){

  if(perfil.tipo === "kids"){
    alert("El perfil Kids no se puede eliminar.");
    return;
  }

  const ok = confirm(`¿Eliminar perfil ${perfil.nombre}?`);

  if(!ok) return;

  try{
    await fetch(`/api/perfiles/${perfil.id}`, {
      method:"DELETE"
    });

    loadProfiles();

  }catch(err){
    console.error("Error eliminando perfil", err);
  }
}

/* =====================================
   EDIT MODE
===================================== */
function toggleEditMode(){
  editMode = !editMode;
  loadProfiles();
}

/* =====================================
   INICIAR
===================================== */
loadProfiles();
</script>

</body>
</html>
