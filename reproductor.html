<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reproductor</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css" />

  <style>
    .reproductor-contenedor{
      padding:100px 4% 50px;
      max-width:1000px;
      margin:0 auto;
    }

    .pantalla-video{
      width:100%;
      aspect-ratio:16/9;
      background:#000;
      border-radius:8px;
      position:relative;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,.9);
    }

    .pantalla-video img{
      width:100%;
      height:100%;
      object-fit:cover;
      opacity:.3;
      position:absolute;
    }

    .btn-play-gigante{
      position:relative;
      z-index:2;
      background:rgba(229,9,20,.9);
      color:white;
      border:none;
      border-radius:50%;
      width:80px;
      height:80px;
      font-size:30px;
      cursor:pointer;
      transition:.2s;
      display:flex;
      justify-content:center;
      align-items:center;
      padding-left:6px;
    }

    .btn-play-gigante:hover{
      transform:scale(1.1);
      background:#e50914;
    }

    .titulo-pelicula{
      font-size:2.5rem;
      margin:20px 0 10px;
    }

    .meta-pelicula{
      color:#aaa;
      margin-bottom:20px;
    }

    .barra{
      width:100%;
      height:6px;
      background:#333;
      border-radius:10px;
      overflow:hidden;
      margin-top:15px;
    }

    .barraFill{
      height:100%;
      width:0%;
      background:#e50914;
    }

    .panelFinal{
      margin-top:20px;
    }

    .btnLike{
      margin-right:10px;
      padding:8px 14px;
      border:none;
      cursor:pointer;
      border-radius:6px;
      background:#222;
      color:#fff;
    }

    .btnLike:hover{
      background:#e50914;
    }

    .slider-peliculas{
      display:flex;
      gap:10px;
      overflow-x:auto;
      margin-top:10px;
      padding-bottom:10px;
    }

    .item-slider{
      width:150px;
      border-radius:6px;
      cursor:pointer;
      transition:.2s;
    }

    .item-slider:hover{
      transform:scale(1.05);
    }
  </style>
</head>

<body>

<header class="navbar scrolled">
  <div class="nav-izq">
    <h1 class="logo">Net<span>flix</span></h1>

    <nav class="menu-principal">
      <a href="index.html">Inicio</a>
      <a href="catalogo.html?tipo=pelicula">Películas</a>
      <a href="catalogo.html?tipo=serie">Series</a>
    </nav>
  </div>
</header>

<main class="reproductor-contenedor">

  <div class="pantalla-video">
    <img id="imagenFondo" alt="">
    <button id="btnPlay" type="button" class="btn-play-gigante">▶</button>
  </div>

  <h2 id="tituloReproductor" class="titulo-pelicula">Cargando...</h2>
  <p id="metaReproductor" class="meta-pelicula"></p>

  <div class="barra">
    <div id="barraFill" class="barraFill"></div>
  </div>

  <p id="tiempoTxt"></p>

  <div id="panelFinal" class="panelFinal"></div>
  <div id="relacionado"></div>

</main>

<script>
const params = new URLSearchParams(window.location.search);
const idPelicula = params.get("id");

const imagenFondo = document.getElementById("imagenFondo");
const tituloReproductor = document.getElementById("tituloReproductor");
const metaReproductor = document.getElementById("metaReproductor");
const btnPlay = document.getElementById("btnPlay");
const barraFill = document.getElementById("barraFill");
const tiempoTxt = document.getElementById("tiempoTxt");
const panelFinal = document.getElementById("panelFinal");
const relacionado = document.getElementById("relacionado");

let peliculaActual = null;
let timerId = null;

const session = JSON.parse(localStorage.getItem("session"));
const perfil = JSON.parse(localStorage.getItem("selectedProfile"));

if(!session || !perfil){
  window.location.href = "login.html";
}

async function cargarPelicula(){
  try{
    const res = await fetch(`/api/peliculas/${idPelicula}`);
    const data = await res.json();

    if(!res.ok || data.error){
      tituloReproductor.textContent = "Película no encontrada";
      btnPlay.style.display = "none";
      return;
    }

    peliculaActual = data;

    imagenFondo.src = data.imagen;
    tituloReproductor.textContent = data.titulo;

    metaReproductor.textContent =
      `${data.genero} · ${data.tipo} · ${(data.tags || []).join(", ")}`;

  }catch(err){
    tituloReproductor.textContent = "Error cargando película";
    btnPlay.style.display = "none";
  }
}

cargarPelicula();

async function iniciarTimer(){
  if(timerId) return;
  if (!peliculaActual) return;

  try{
    await fetch("/api/reproducciones", {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body: JSON.stringify({
        usuario_id: session.id,
        perfil_id: perfil.id,
        pelicula_id: idPelicula
      })
    });
  }catch(err){
    console.log("No se pudo guardar historial");
  }

  btnPlay.style.display = "none";

  const duracion = peliculaActual?.duracion_min || 10;
  const inicio = Date.now();

  timerId = setInterval(() => {
    const transcurrido = (Date.now() - inicio) / 1000;
    const progreso = Math.min(transcurrido / duracion, 1);

    barraFill.style.width = (progreso * 100) + "%";
    tiempoTxt.textContent =
      `${transcurrido.toFixed(1)} / ${duracion}s`;

    if(progreso >= 1){
      clearInterval(timerId);
      timerId = null;
      finalizar();
    }

  }, 200);
}

function finalizar(){
  panelFinal.innerHTML = `
    <p><b>¿Qué te pareció?</b></p>
    <button class="btnLike" data="1">Me gusta</button>
    <button class="btnLike" data="0">No me gusta</button>
  `;

  document.querySelectorAll(".btnLike").forEach(btn => {
    btn.onclick = async () => {

      const valor = btn.getAttribute("data");

      await fetch("/api/calificar", {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body: JSON.stringify({
          pelicula_id:idPelicula,
          valor:valor
        })
      });

      if(valor == "1"){
        mostrarRelacionado();
      }else{
        panelFinal.innerHTML += "<p>No te gustó 😢</p>";
      }
    };
  });
}

async function mostrarRelacionado(){
  try{
    const res = await fetch(`/api/recomendaciones/${idPelicula}`);
    const data = await res.json();

    let html = "";

    if(data.similares?.length){
      html += `
        <h3>Porque viste este género</h3>
        <div class="slider-peliculas">
          ${data.similares.map(p => `
            <img
              class="item-slider"
              alt=""
              src="${p.imagen}"
              onclick="location.href='reproductor.html?id=${p.id}'"
            >
          `).join("")}
        </div>
      `;
    }

    if(data.etiquetas?.length){
      html += `
        <h3>Por etiquetas</h3>
        <div class="slider-peliculas">
          ${data.etiquetas.map(p => `
            <img
              class="item-slider"
              alt=""
              src="${p.imagen}"
              onclick="location.href='reproductor.html?id=${p.id}'"
            >
          `).join("")}
        </div>
      `;
    }

    relacionado.innerHTML = html;

  }catch(err){
    relacionado.innerHTML = "";
  }
}

btnPlay.onclick = iniciarTimer;
</script>

</body>
</html>
