<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix Clone</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css" />
  <script src="index.js" defer></script>
</head>
<body>

<header class="navbar">
  <div class="nav-izq">
    <h1 class="logo">Net<span>flix</span></h1>

    <nav class="menu-principal">
      <a href="index.html" class="activo">Inicio</a>
      <a href="catalogo.html?tipo=pelicula">Películas</a>
      <a href="catalogo.html?tipo=serie">Series</a>
    </nav>
  </div>

  <div class="nav-der">
    <div class="campo-entrada">

      <div class="inputRow">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <path
            d="M11 19C15.4183 19 19 15.4183 19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19Z"
            stroke="white" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
          <path
            d="M21 21L16.65 16.65"
            stroke="white" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

        <input
          type="text"
          id="inputBuscador"
          autocomplete="off"
          placeholder="Títulos, personas, géneros..."
        >
      </div>

      <div id="dropdown" class="dropdown" role="listbox">
        <div class="dropdownHeader">
          <span id="tituloDropdown">Coincidencias</span>
          <span id="badge" class="badge"></span>
        </div>

        <ul id="lista" class="lista"></ul>
      </div>

    </div>
  </div>
</header>

<div class="contenedor-mensajes">
  <div id="resultado" class="caja-mensaje"></div>
</div>

<!-- HERO -->
<section class="hero" style="background-image:url('imgs/bl.jpeg');">
  <div class="hero-vignette"></div>

  <div class="hero-contenido">
    <h2 class="hero-titulo">Blade Runner 2049</h2>

    <p class="hero-sinopsis">
      Un nuevo blade runner descubre un secreto largamente oculto que podría acabar
      con el caos que impera en la sociedad. El descubrimiento le lleva a iniciar
      la búsqueda de Rick Deckard.
    </p>

    <div class="hero-botones">

      <button class="btn btn-blanco" onclick="reproducir('bladerunner')">
        ▶ Reproducir
      </button>

      <button class="btn btn-gris"
        onclick="window.location.href='detalle.html?id=bladerunner'">
        ⓘ Más información
      </button>

    </div>
  </div>
</section>

<!-- CONTENIDO DINÁMICO -->
<main class="contenedor-principal" id="contenedorPrincipal"></main>

<script>
const session = JSON.parse(localStorage.getItem("session"));

if (!session) {
  window.location.href = "login.html";
}

async function reproducir(peliculaId) {
  try {

    const perfil = JSON.parse(localStorage.getItem("selectedProfile"));

    if (session && perfil) {
      await fetch("/api/reproducciones", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          usuario_id: session.id,
          perfil_id: perfil.id,
          pelicula_id: peliculaId
        })
      });
    }

    window.location.href = "reproductor.html?id=" + peliculaId;

  } catch (error) {
    console.error("Error guardando historial:", error);

    window.location.href = "reproductor.html?id=" + peliculaId;
  }
}
</script>

</body>
</html>
