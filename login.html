<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix - Iniciar sesión</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#141414;
color:white;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.login-box{
background:rgba(0,0,0,.75);
padding:40px;
width:380px;
border-radius:8px;
}

h1{
color:#e50914;
margin-bottom:20px;
text-align:center;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:4px;
background:#333;
color:white;
}

button{
width:100%;
padding:14px;
background:#e50914;
border:none;
color:white;
font-size:16px;
cursor:pointer;
border-radius:4px;
margin-top:10px;
}

button:hover{
background:#f40612;
}

.secondary{
background:#333;
margin-top:5px;
}

.error{
color:#ff6161;
margin-top:10px;
text-align:center;
}
</style>
</head>

<body>

<div class="login-box">

<h1>NETFLIX</h1>

<input type="text" id="nombre" placeholder="Nombre (solo registro)">
<input type="email" id="email" placeholder="Correo">
<input type="password" id="password" placeholder="Contraseña">

<button onclick="login()">Iniciar sesión</button>
<button class="secondary" onclick="register()">Crear cuenta</button>

<div class="error" id="error"></div>

</div>

<script>

async function login(){

const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value.trim();
const error = document.getElementById("error");

error.innerHTML = "";

if(!email || !password){
error.innerHTML = "Completa todos los campos";
return;
}

try {

const res = await fetch("/api/login", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ email, password })
});

const data = await res.json();

if(!res.ok){
error.innerHTML = data.error || "Error en login";
return;
}

// 🔥 SOLO GUARDAMOS SESIÓN
localStorage.setItem("session", JSON.stringify(data));

window.location.href = "accounts.html";

} catch(err){
error.innerHTML = "Error de servidor";
}

}

async function register(){

const nombre = document.getElementById("nombre").value.trim();
const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value.trim();
const error = document.getElementById("error");

error.innerHTML = "";

if(!nombre || !email || !password){
error.innerHTML = "Completa todos los campos para registrarte";
return;
}

try {

const res = await fetch("/api/register", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ nombre, email, password })
});

const data = await res.json();

if(!res.ok){
error.innerHTML = data.error || "Error al registrar";
return;
}

// login automático
localStorage.setItem("session", JSON.stringify(data));

window.location.href = "accounts.html";

} catch(err){
error.innerHTML = "Error de servidor";
}

}

</script>

</body>
</html>
