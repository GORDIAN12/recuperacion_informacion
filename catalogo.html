<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>

  <header class="navbar scrolled">
    <div class="nav-izq">
      <h1 class="logo">Net<span>flix</span></h1>
      <nav class="menu-principal">
        <a href="index.html">Inicio</a>
        <a href="catalogo.html?tipo=pelicula">Películas</a>
        <a href="catalogo.html?tipo=serie">Series</a>
      </nav>
    </div>
  </header>

  <main class="contenedor-principal catalogo-espaciado">
    <h2 id="tituloPagina" class="titulo-fila" style="font-size: 2rem; margin-bottom: 30px;">Catálogo</h2>
    <div id="contenedorGrilla" class="grilla-catalogo">
    </div>
  </main>

  <script>
    const session = JSON.parse(localStorage.getItem('session'));
    if (!session) {
      window.location.href = 'login.html';
    }

    const urlParams = new URLSearchParams(window.location.search);
    const tipoFiltro = urlParams.get('tipo');
    const tituloPagina = document.getElementById('tituloPagina');
    const contenedorGrilla = document.getElementById('contenedorGrilla');

    if (tipoFiltro === 'pelicula') {
      tituloPagina.textContent = 'Películas';
    } else if (tipoFiltro === 'serie') {
      tituloPagina.textContent = 'Series';
    }

    async function cargarCatalogo() {
      try {
        const resp = await fetch('/api/peliculas');
        const banco = await resp.json();
        const resultados = tipoFiltro
          ? banco.filter(item => item.tipo === tipoFiltro)
          : banco;

        if (resultados.length > 0) {
          contenedorGrilla.innerHTML = resultados.map(p => `
        <img src="${p.imagen}" alt="${p.titulo}" class="item-slider" onclick="window.location.href='reproductor.html?id=${p.id}'" style="width: 100%; height: auto; aspect-ratio: 2/3;">
      `).join('');
        } else {
          contenedorGrilla.innerHTML =
            '<p>No se encontraron títulos en esta categoría.</p>';
        }
      } catch (e) {
        contenedorGrilla.innerHTML =
          '<p>Error al cargar el catálogo.</p>';
      }
    }

    cargarCatalogo();
  </script>
</body>
</html>
